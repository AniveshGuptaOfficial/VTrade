# ===== Server =====
server.port=8080

# ===== Database =====
# Local dev default: H2 file-based, persists in VTrade_Backend/data/
# In production (Render), these are overridden by environment variables:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:h2:file:./data/vtrade;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
# No explicit database-platform — Hibernate auto-detects the correct SQL
# dialect from the JDBC driver, so this same config works for both H2 and Postgres.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
vtrade.jwt.secret=vtrade-super-secret-key-change-this-in-production-min-256-bits-long
vtrade.jwt.expiration-ms=86400000

# ===== File Uploads =====
vtrade.uploads.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== CORS =====
vtrade.cors.allowed-origins=*

# ===== Demo OTP (returned in response for dev/demo) =====
vtrade.otp.demo-mode=true
vtrade.otp.expiry-minutes=10

# ===== Google Sign-In =====

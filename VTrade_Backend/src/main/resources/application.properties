# ===== Server =====
server.port=8080

# ===== H2 In-Memory Database (dev) =====
spring.datasource.url=jdbc:h2:mem:vtrade;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
vtrade.jwt.secret=vtrade-super-secret-key-change-this-in-production-min-256-bits-long
vtrade.jwt.expiration-ms=86400000

# ===== File Uploads =====
vtrade.uploads.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== CORS =====
vtrade.cors.allowed-origins=*

# ===== Demo OTP (returned in response for dev/demo) =====
vtrade.otp.demo-mode=true
vtrade.otp.expiry-minutes=10
